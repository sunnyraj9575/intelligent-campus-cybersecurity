[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-campus"
version = "1.0.0"
description = "Supervised machine-learning threat detection for campus network flows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.4.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
sentinel-generate-data = "src.data_generator:main"
sentinel-train = "src.train:main"
sentinel-predict = "src.predict:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
