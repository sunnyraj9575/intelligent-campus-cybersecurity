name: Deploy project website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir site
          cp index.html styles.css script.js site/
          touch site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
